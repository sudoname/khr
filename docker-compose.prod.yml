# Production stack for khr.ng
#
# Usage (on the server, from the repo root):
#   cp .env.prod.example .env   # then fill in secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Nothing is exposed publicly except the web app on 127.0.0.1:3004 — nginx
# terminates TLS for khr.ng and proxies to it. The web app proxies /api/* to
# the API container internally, so cookies stay first-party.
name: khr

services:
  postgres:
    # Pinned minor version: rebuilds must not surprise-upgrade the database.
    image: postgres:16.15-alpine
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: peopleflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: peopleflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peopleflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    # AOF persistence so queued jobs (payslip emails etc.) survive a crash.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Email catcher, used until a real SMTP provider is configured via
  # SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASS in .env. UI is bound to localhost
  # only; reach it with: ssh -L 8025:127.0.0.1:8025 root@<server>
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:8025:8025"

  # One-shot migration runner (exits after `prisma migrate deploy`). It is the
  # ONLY service that holds the owner (DDL-capable, RLS-exempt) database
  # credentials; the long-lived api/worker containers never see them and wait
  # for this to complete successfully before starting.
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    image: khr-api
    restart: "no"
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://peopleflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/peopleflow
    command: ["pnpm", "--filter", "@peopleflow/database", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    image: khr-api
    restart: unless-stopped
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      API_PORT: 4000
      # Runtime connects as the non-owner `khr_app` role so Postgres RLS
      # applies (see migration rls_enforcement_and_employee_seq). One-time
      # setup: ALTER ROLE khr_app PASSWORD '<APP_DB_PASSWORD>';
      DATABASE_URL: postgresql://khr_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/peopleflow
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:-https://khr.ng}
      # Per-company workspace subdomains (acme.khr.ng). BASE_DOMAIN allows
      # subdomain origins/redirects; COOKIE_DOMAIN makes the session cookie
      # span the apex and all subdomains.
      BASE_DOMAIN: ${BASE_DOMAIN:-khr.ng}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.khr.ng}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SECURE_COOKIES: "1"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-KHR <no-reply@khr.ng>}
      SEED_PLATFORM_ADMIN_EMAIL: ${SEED_PLATFORM_ADMIN_EMAIL:-}
      SEED_PLATFORM_ADMIN_PASSWORD: ${SEED_PLATFORM_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://khr_app:${APP_DB_PASSWORD}@postgres:5432/peopleflow
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-KHR <no-reply@khr.ng>}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_BASE_DOMAIN: ${BASE_DOMAIN:-khr.ng}
    restart: unless-stopped
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      # Next writes its runtime caches (image optimizer, fetch cache) here.
      - /tmp
      - /app/apps/web/.next/cache
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    ports:
      - "127.0.0.1:3004:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
