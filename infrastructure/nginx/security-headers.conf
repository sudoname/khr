# PeopleFlow — nginx security headers snippet (WP-11).
#
# The app layer already sets these on every response (API middleware and
# next.config.mjs headers()), so nginx normally just passes them through.
# This snippet exists for responses nginx generates ITSELF (error pages,
# rate-limit rejections, maintenance pages), which never reach the app.
#
# Usage: copy to /etc/nginx/snippets/security-headers.conf, then inside the
# khr.ng server block add:
#
#   include snippets/security-headers.conf;
#
# NOTE on duplication: `add_header` appends; it does not replace headers
# coming from the proxied upstream. To avoid doubled headers on proxied
# responses, either include this only in `location` blocks that are NOT
# proxied (recommended), or strip the upstream copies first with
# `proxy_hide_header` for each name below.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
